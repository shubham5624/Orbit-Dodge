<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Orbit Dodge - Cyberpunk Hyper-Casual Game</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070913;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      touch-action: none;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #111827 0%, #070913 100%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Top HUD */
    .hud {
      position: absolute;
      top: env(safe-area-inset-top, 24px);
      left: 0;
      right: 0;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .score-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .score-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #00f3ff;
      text-transform: uppercase;
    }

    .score-value {
      font-size: 34px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(0, 243, 255, 0.6);
      line-height: 1;
      margin-top: 2px;
    }

    .score-multiplier {
      font-size: 12px;
      font-weight: 800;
      color: #ff007f;
      letter-spacing: 1px;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      transform: scale(0.9);
      margin-top: 3px;
    }

    .score-multiplier.active {
      opacity: 1;
      transform: scale(1);
    }

    .hud-controls {
      pointer-events: auto;
      display: flex;
      gap: 12px;
    }

    .hud-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform 0.15s ease, background 0.2s ease;
      touch-action: manipulation;
    }

    .hud-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.18);
    }

    .hud-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Modals & Overlays */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(7, 9, 19, 0.82);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 20;
      padding: 24px;
      text-align: center;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.3s;
    }

    .overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .logo-title {
      font-size: clamp(38px, 10vw, 56px);
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #00f3ff 0%, #ff007f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 18px rgba(0, 243, 255, 0.5));
    }

    .tagline {
      font-size: 14px;
      color: #94a3b8;
      letter-spacing: 3px;
      margin-bottom: 32px;
      text-transform: uppercase;
      font-weight: 500;
    }

    .instruction-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px 24px;
      margin-bottom: 36px;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .instruction-step {
      font-size: 13px;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .instruction-step .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00f3ff;
      box-shadow: 0 0 6px #00f3ff;
      flex-shrink: 0;
    }

    .instruction-step:nth-child(2) .dot {
      background: #ffe600;
      box-shadow: 0 0 6px #ffe600;
    }

    .instruction-step:nth-child(3) .dot {
      background: #ff0055;
      box-shadow: 0 0 6px #ff0055;
    }

    .primary-btn {
      background: linear-gradient(135deg, #00f3ff 0%, #0077ff 100%);
      color: #070913;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 16px 48px;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 243, 255, 0.35);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      touch-action: manipulation;
    }

    .primary-btn:active {
      transform: scale(0.95);
      box-shadow: 0 4px 12px rgba(0, 243, 255, 0.2);
    }

    /* Game Over Modal Stats */
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 32px;
      width: 100%;
      max-width: 300px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 14px;
    }

    .stat-card .label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .stat-card .value {
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
    }

    .stat-card.best .value {
      color: #ffe600;
      text-shadow: 0 0 10px rgba(255, 230, 0, 0.4);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- In-Game HUD -->
    <header class="hud">
      <div class="score-group">
        <span class="score-label">Score</span>
        <span class="score-value" id="hudScore">0</span>
        <span class="score-multiplier" id="hudCombo">x1.0 SPEED</span>
      </div>
      <div class="hud-controls">
        <button id="muteBtn" class="hud-btn" aria-label="Toggle Sound">
          <svg id="soundOnIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <svg id="soundOffIcon" viewBox="0 0 24 24" style="display:none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>
      </div>
    </header>

    <!-- Start Overlay Screen -->
    <div id="startScreen" class="overlay">
      <h1 class="logo-title">Orbit Dodge</h1>
      <p class="tagline">Tap to switch orbit direction</p>

      <div class="instruction-card">
        <div class="instruction-step">
          <div class="dot"></div>
          <span><strong>Tap anywhere:</strong> Instant flip orbit</span>
        </div>
        <div class="instruction-step">
          <div class="dot"></div>
          <span><strong>Absorb gems:</strong> High-octane score surge</span>
        </div>
        <div class="instruction-step">
          <div class="dot"></div>
          <span><strong>Evade meteors:</strong> Radial asteroids kill</span>
        </div>
      </div>

      <button id="startBtn" class="primary-btn">Start Orbit</button>
    </div>

    <!-- Game Over Overlay Screen -->
    <div id="gameOverScreen" class="overlay hidden">
      <h1 class="logo-title" style="background: linear-gradient(135deg, #ff0055 0%, #ff7700 100%); -webkit-background-clip: text;">Destroyed</h1>
      <p class="tagline">Orbit sequence breached</p>

      <div class="stat-grid">
        <div class="stat-card">
          <div class="label">Orbit Score</div>
          <div class="value" id="finalScore">0</div>
        </div>
        <div class="stat-card best">
          <div class="label">Best Record</div>
          <div class="value" id="bestScore">0</div>
        </div>
      </div>

      <button id="restartBtn" class="primary-btn">Try Again</button>
    </div>
  </div>

  <script>
    /**
     * Web Audio API Sound Synthesizer
     * Pure zero-asset procedural sound generation
     */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playReverse(freq = 520) {
        if (this.isMuted || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const now = this.ctx.currentTime;

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.08);

          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.09);
        } catch (e) {}
      }

      playGemPickup() {
        if (this.isMuted || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [0, 0.06, 0.12].forEach((offset, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const freq = [587.33, 739.99, 880.00][idx];

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + offset);

            gain.gain.setValueAtTime(0.15, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.18);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now + offset);
            osc.stop(now + offset + 0.2);
          });
        } catch (e) {}
      }

      playExplosion() {
        if (this.isMuted || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          // Noise buffer for blast
          const bufferSize = this.ctx.sampleRate * 0.45;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(800, now);
          filter.frequency.linearRampToValueAtTime(50, now + 0.45);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          noise.start(now);
          noise.stop(now + 0.46);

          // Sub-bass sine drop
          const sub = this.ctx.createOscillator();
          const subGain = this.ctx.createGain();
          sub.type = 'sine';
          sub.frequency.setValueAtTime(120, now);
          sub.frequency.exponentialRampToValueAtTime(30, now + 0.4);

          subGain.gain.setValueAtTime(0.5, now);
          subGain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

          sub.connect(subGain);
          subGain.connect(this.ctx.destination);
          sub.start(now);
          sub.stop(now + 0.41);
        } catch (e) {}
      }
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    // UI Elements
    const hudScore = document.getElementById('hudScore');
    const hudCombo = document.getElementById('hudCombo');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const muteBtn = document.getElementById('muteBtn');
    const soundOnIcon = document.getElementById('soundOnIcon');
    const soundOffIcon = document.getElementById('soundOffIcon');
    const finalScore = document.getElementById('finalScore');
    const bestScore = document.getElementById('bestScore');

    const sound = new SoundEngine();

    // High Score Persistence
    const STORAGE_KEY = 'orbit_dodge_hi_score';
    let highRecord = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);

    // Screen Dimensions & DPI Handling
    let width = 0;
    let height = 0;
    let centerX = 0;
    let centerY = 0;
    let orbitRadius = 130;
    let coreRadius = 36;
    let dpr = 1;

    // Game Core State
    let gameState = 'START'; // 'START' | 'PLAYING' | 'GAMEOVER'
    let score = 0;
    let scoreTimer = 0;
    let speedMultiplier = 1.0;
    let screenShake = 0;

    // Player State
    const player = {
      angle: -Math.PI / 2,
      angularVelocity: 0.042,
      direction: 1, // 1: CW, -1: CCW
      radius: 9,
      trail: [],
      maxTrail: 18,
      boostEnergy: 0
    };

    // Game Entities Collections
    let obstacles = [];
    let gems = [];
    let particles = [];
    let shockwaves = [];

    let obstacleSpawnTimer = 0;
    let gemSpawnTimer = 0;

    function resizeCanvas() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);

      ctx.resetTransform();
      ctx.scale(dpr, dpr);

      centerX = width / 2;
      centerY = height / 2;

      // Dynamically fit orbit to screen dimensions
      const minDim = Math.min(width, height);
      orbitRadius = Math.max(85, Math.min(minDim * 0.36, 175));
      coreRadius = orbitRadius * 0.28;
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 100));
    resizeCanvas();

    class Particle {
      constructor(x, y, color, size, speed, decay = 0.03) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.size = size;
        this.alpha = 1;
        this.decay = decay;
        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * speed * (0.4 + Math.random() * 0.6);
        this.vy = Math.sin(angle) * speed * (0.4 + Math.random() * 0.6);
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
        this.size = Math.max(0, this.size - 0.06);
        return this.alpha > 0 && this.size > 0;
      }

      draw(context) {
        context.save();
        context.globalAlpha = Math.max(0, this.alpha);
        context.fillStyle = this.color;
        context.shadowColor = this.color;
        context.shadowBlur = 10;
        context.beginPath();
        context.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        context.fill();
        context.restore();
      }
    }

    class Shockwave {
      constructor(x, y, maxR, color, strokeW = 4) {
        this.x = x;
        this.y = y;
        this.r = 8;
        this.maxR = maxR;
        this.color = color;
        this.strokeW = strokeW;
        this.alpha = 1;
      }

      update() {
        this.r += (this.maxR - this.r) * 0.12 + 1.2;
        this.alpha = Math.max(0, 1 - (this.r / this.maxR));
        return this.r < this.maxR && this.alpha > 0.01;
      }

      draw(context) {
        context.save();
        context.globalAlpha = this.alpha;
        context.strokeStyle = this.color;
        context.shadowColor = this.color;
        context.shadowBlur = 12;
        context.lineWidth = this.strokeW * this.alpha;
        context.beginPath();
        context.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        context.stroke();
        context.restore();
      }
    }

    function createExplosion(x, y, color = '#ff0055', count = 38) {
      screenShake = 16;
      shockwaves.push(new Shockwave(x, y, 90, color, 5));
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color, Math.random() * 4 + 2, Math.random() * 8 + 3, 0.025));
      }
    }

    function createGemBurst(x, y) {
      shockwaves.push(new Shockwave(x, y, 40, '#ffe600', 3));
      for (let i = 0; i < 18; i++) {
        particles.push(new Particle(x, y, '#ffe600', Math.random() * 3 + 1.5, Math.random() * 5 + 2, 0.04));
      }
    }

    class Asteroid {
      constructor() {
        this.angle = Math.random() * Math.PI * 2;
        // Direction: either radiating outwards from center, or collapsing inwards from outside
        this.fromCenter = Math.random() < 0.55;
        this.radius = this.fromCenter ? 12 : Math.max(width, height) * 0.65;
        this.speed = (this.fromCenter ? 1 : -1) * (1.8 + Math.random() * 1.5) * speedMultiplier;
        this.size = Math.random() * 4 + 7; // asteroid hit radius
        this.color = '#ff1744';
        this.pulse = Math.random() * Math.PI;
      }

      update() {
        this.radius += this.speed;
        this.pulse += 0.08;

        // Current world coords
        this.x = centerX + Math.cos(this.angle) * this.radius;
        this.y = centerY + Math.sin(this.angle) * this.radius;

        // Check bounds
        const maxBound = Math.max(width, height) * 0.75;
        if (this.fromCenter && this.radius > maxBound) return false;
        if (!this.fromCenter && this.radius < 5) return false;
        return true;
      }

      draw(context) {
        context.save();
        context.fillStyle = this.color;
        context.shadowColor = '#ff0055';
        context.shadowBlur = 12;

        const dynamicSize = this.size + Math.sin(this.pulse) * 1.2;
        context.beginPath();
        context.arc(this.x, this.y, dynamicSize, 0, Math.PI * 2);
        context.fill();

        // Inner glowing core
        context.fillStyle = '#ffffff';
        context.beginPath();
        context.arc(this.x, this.y, dynamicSize * 0.45, 0, Math.PI * 2);
        context.fill();
        context.restore();
      }
    }

    class Gem {
      constructor() {
        // Appears somewhere on the orbit path
        this.angle = Math.random() * Math.PI * 2;
        this.size = 7;
        this.pulse = 0;
        this.collected = false;
      }

      update() {
        this.pulse += 0.07;
        this.x = centerX + Math.cos(this.angle) * orbitRadius;
        this.y = centerY + Math.sin(this.angle) * orbitRadius;
        return !this.collected;
      }

      draw(context) {
        context.save();
        context.translate(this.x, this.y);
        context.rotate(this.pulse);

        const s = this.size + Math.sin(this.pulse * 2) * 1.5;
        context.fillStyle = '#ffe600';
        context.shadowColor = '#ffe600';
        context.shadowBlur = 14;

        // Diamond star polygon
        context.beginPath();
        context.moveTo(0, -s);
        context.lineTo(s * 0.7, 0);
        context.lineTo(0, s);
        context.lineTo(-s * 0.7, 0);
        context.closePath();
        context.fill();

        // Inner spark
        context.fillStyle = '#ffffff';
        context.beginPath();
        context.arc(0, 0, s * 0.35, 0, Math.PI * 2);
        context.fill();

        context.restore();
      }
    }

    function triggerAction() {
      sound.init();

      if (gameState === 'START') {
        startGame();
        return;
      }

      if (gameState === 'PLAYING') {
        player.direction *= -1;
        sound.playReverse(560 + Math.random() * 80);

        // Instant burst at player position
        const px = centerX + Math.cos(player.angle) * orbitRadius;
        const py = centerY + Math.sin(player.angle) * orbitRadius;
        for (let i = 0; i < 6; i++) {
          particles.push(new Particle(px, py, '#00f3ff', 2.5, 3, 0.08));
        }
      }
    }

    // Direct event listener for zero touch latency
    window.addEventListener('pointerdown', (e) => {
      // Ignore click if hitting HUD buttons or overlay action buttons directly
      if (e.target.closest('#muteBtn') || e.target.closest('.primary-btn')) return;
      e.preventDefault();
      triggerAction();
    }, { passive: false });

    // Keyboard support (Space or Enter)
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        triggerAction();
      }
    });

    // Mute toggle
    muteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      sound.init();
      sound.isMuted = !sound.isMuted;
      soundOnIcon.style.display = sound.isMuted ? 'none' : 'block';
      soundOffIcon.style.display = sound.isMuted ? 'block' : 'none';
    });

    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      sound.init();
      startGame();
    });

    restartBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      sound.init();
      startGame();
    });

    function startGame() {
      gameState = 'PLAYING';
      score = 0;
      scoreTimer = 0;
      speedMultiplier = 1.0;
      screenShake = 0;

      player.angle = -Math.PI / 2;
      player.direction = 1;
      player.trail = [];
      player.boostEnergy = 0;

      obstacles = [];
      gems = [];
      particles = [];
      shockwaves = [];

      obstacleSpawnTimer = 0;
      gemSpawnTimer = 30; // initial gem drops quickly

      hudScore.textContent = '0';
      hudCombo.textContent = 'x1.0 SPEED';
      hudCombo.classList.remove('active');

      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
    }

    function triggerGameOver() {
      gameState = 'GAMEOVER';
      sound.playExplosion();

      const px = centerX + Math.cos(player.angle) * orbitRadius;
      const py = centerY + Math.sin(player.angle) * orbitRadius;
      createExplosion(px, py, '#ff0055', 45);

      if (score > highRecord) {
        highRecord = score;
        try {
          localStorage.setItem(STORAGE_KEY, highRecord.toString());
        } catch (e) {}
      }

      finalScore.textContent = score;
      bestScore.textContent = highRecord;

      setTimeout(() => {
        gameOverScreen.classList.remove('hidden');
      }, 550);
    }

    function update() {
      // Handle screen shake decay
      if (screenShake > 0) {
        screenShake *= 0.88;
        if (screenShake < 0.1) screenShake = 0;
      }

      // Update particle effects
      for (let i = particles.length - 1; i >= 0; i--) {
        if (!particles[i].update()) particles.splice(i, 1);
      }
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        if (!shockwaves[i].update()) shockwaves.splice(i, 1);
      }

      if (gameState !== 'PLAYING') return;

      // Time-based scoring & continuous difficulty scale
      scoreTimer++;
      if (scoreTimer % 28 === 0) {
        score += 1;
        hudScore.textContent = score;
      }

      // Smooth gradual speed ramp
      speedMultiplier = Math.min(2.1, 1.0 + (score / 150) * 0.4);
      if (speedMultiplier > 1.2) {
        hudCombo.textContent = `x${speedMultiplier.toFixed(1)} SPEED`;
        hudCombo.classList.add('active');
      }

      // Update Player position along circular track
      const currentAngularVel = player.angularVelocity * player.direction * (1 + (speedMultiplier - 1) * 0.5);
      player.angle += currentAngularVel;

      const px = centerX + Math.cos(player.angle) * orbitRadius;
      const py = centerY + Math.sin(player.angle) * orbitRadius;

      // Push trail position
      player.trail.unshift({ x: px, y: py, alpha: 1.0 });
      if (player.trail.length > player.maxTrail) {
        player.trail.pop();
      }

      // Boost decay from gem pickup
      if (player.boostEnergy > 0) {
        player.boostEnergy -= 0.02;
      }

      // Obstacle Spawning
      obstacleSpawnTimer += speedMultiplier;
      const spawnInterval = Math.max(34, 75 - (score * 0.45));
      if (obstacleSpawnTimer > spawnInterval) {
        obstacleSpawnTimer = 0;
        obstacles.push(new Asteroid());
      }

      // Gem Spawning
      gemSpawnTimer++;
      if (gemSpawnTimer > 210 && gems.length < 2) {
        gemSpawnTimer = 0;
        gems.push(new Gem());
      }

      // Update Gems & Collision with Player
      for (let i = gems.length - 1; i >= 0; i--) {
        const gem = gems[i];
        if (!gem.update()) {
          gems.splice(i, 1);
          continue;
        }

        const distGem = Math.hypot(px - gem.x, py - gem.y);
        if (distGem < player.radius + gem.size + 4) {
          gem.collected = true;
          sound.playGemPickup();
          score += 10;
          hudScore.textContent = score;
          player.boostEnergy = 1.0;
          createGemBurst(gem.x, gem.y);
          gems.splice(i, 1);
        }
      }

      // Update Obstacles & Collision with Player
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        if (!obs.update()) {
          obstacles.splice(i, 1);
          continue;
        }

        const distObs = Math.hypot(px - obs.x, py - obs.y);
        if (distObs < player.radius + obs.size - 2) {
          triggerGameOver();
          return;
        }
      }
    }

    function draw() {
      ctx.save();

      // Clear Screen
      ctx.fillStyle = '#070913';
      ctx.fillRect(0, 0, width, height);

      // Apply Screen Shake
      if (screenShake > 0) {
        const shakeX = (Math.random() - 0.5) * screenShake;
        const shakeY = (Math.random() - 0.5) * screenShake;
        ctx.translate(shakeX, shakeY);
      }

      // 1. Draw subtle background radial grid/glow
      const bgGrad = ctx.createRadialGradient(centerX, centerY, coreRadius * 0.5, centerX, centerY, orbitRadius * 2);
      bgGrad.addColorStop(0, 'rgba(0, 243, 255, 0.08)');
      bgGrad.addColorStop(0.5, 'rgba(17, 24, 39, 0.02)');
      bgGrad.addColorStop(1, 'rgba(7, 9, 19, 0)');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      // 2. Draw Orbit Track
      ctx.save();
      ctx.strokeStyle = 'rgba(0, 243, 255, 0.22)';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = 'rgba(0, 243, 255, 0.4)';
      ctx.shadowBlur = 8;
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      ctx.arc(centerX, centerY, orbitRadius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // 3. Draw Center Pulsing Core
      ctx.save();
      const corePulse = Math.sin(Date.now() * 0.004) * 3;
      const coreGrad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, coreRadius + corePulse);
      coreGrad.addColorStop(0, '#00f3ff');
      coreGrad.addColorStop(0.5, 'rgba(0, 119, 255, 0.7)');
      coreGrad.addColorStop(1, 'rgba(0, 243, 255, 0)');

      ctx.fillStyle = coreGrad;
      ctx.beginPath();
      ctx.arc(centerX, centerY, coreRadius + corePulse, 0, Math.PI * 2);
      ctx.fill();

      // Core inner solid sphere
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#00f3ff';
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.arc(centerX, centerY, coreRadius * 0.38, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 4. Draw Collectibles (Gems)
      for (const gem of gems) {
        gem.draw(ctx);
      }

      // 5. Draw Obstacles (Asteroids)
      for (const obs of obstacles) {
        obs.draw(ctx);
      }

      // 6. Draw Player & Trail
      if (gameState === 'PLAYING' || gameState === 'START') {
        const px = centerX + Math.cos(player.angle) * orbitRadius;
        const py = centerY + Math.sin(player.angle) * orbitRadius;

        // Motion Trail
        for (let i = 0; i < player.trail.length; i++) {
          const pt = player.trail[i];
          const progress = 1 - (i / player.trail.length);
          ctx.save();
          ctx.globalAlpha = progress * 0.55;
          ctx.fillStyle = player.boostEnergy > 0 ? '#ffe600' : '#00f3ff';
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, player.radius * progress * 0.85, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Main Player Orb
        ctx.save();
        ctx.shadowColor = player.boostEnergy > 0 ? '#ffe600' : '#00f3ff';
        ctx.shadowBlur = 16;
        ctx.fillStyle = player.boostEnergy > 0 ? '#ffe600' : '#00f3ff';
        ctx.beginPath();
        ctx.arc(px, py, player.radius, 0, Math.PI * 2);
        ctx.fill();

        // Hot center spot
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(px, py, player.radius * 0.45, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 7. Draw Shockwaves & Particles
      for (const sw of shockwaves) {
        sw.draw(ctx);
      }
      for (const p of particles) {
        p.draw(ctx);
      }

      ctx.restore();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    window.onload = function() {
      resizeCanvas();
      requestAnimationFrame(gameLoop);
    };
  </script>
</body>
</html>
